name: CI

# Skip CI when only docs / non-code change — the orchestrator build is expensive
# (base image + full assembled colcon build).
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]
  pull_request:
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]

# Read-only by default. The two jobs that touch a registry mint their own
# short-lived App token, so no job needs a broader GITHUB_TOKEN than this.
permissions:
  contents: read

# One run per ref. A push onto a branch that is already building supersedes the
# older run; main is never cancelled, so every merged commit keeps a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Rendered files (AGENTS.md, .fm/) come from the render plane and carry a hash of
  # their own body. This fails the PR when one was edited in place.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  # No server-side branch protection exists on this repo, so a push straight to
  # main is possible. The rendered pre-push hook refuses one locally; this
  # notices the ones it cannot refuse and opens an issue naming the commit.
  # The called job guards on push-to-default itself, so it skips on a PR.
  # Job-level permissions replace the workflow-level block for this job alone:
  # opening the issue needs issues:write, which the rest of CI must not have.
  tripwire:
    uses: first-motive/.github/.github/workflows/direct-push-tripwire.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: read

  # The piped-curl front door check, the in-tree updater and uninstall smokes, and
  # the install-script parse pass all live in first-motive/.github.
  selftest:
    uses: first-motive/.github/.github/workflows/bootstrap-selftest.yml@main
    with:
      scripts: install.sh run.sh
      in-tree-scripts: '"scripts/update.sh" "install.sh uninstall --purge"'
      parse-globs: scripts/install/*.sh scripts/run/*.sh

  # The workflows are now code — a composite action, expressions referring to its
  # outputs, shell in `run:` blocks. actionlint type-checks the expressions and runs
  # shellcheck over the shell, which is how the SC2155 in the native job was found.
  # The version is pinned in the script, so this cannot go red on a tool update.
  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: ./scripts/ci/lint-workflows.sh

  # Workspace-specific guards that no other repo runs: the updater's busy gate,
  # the bridge endpoint config, the recorder's udev rule install, and the
  # checkout spelling the import manifests hand to colcon.
  appliance:
    name: appliance guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The appliance updater must tell "a take is in flight" from "idle". The
      # tactile bridge appends to recordings/tactile-raw continuously, even while
      # the recorder is idle, so the updater prunes that one directory — without
      # the prune a glove-equipped rig can never converge on an update.
      - name: appliance updater busy gate (recorder)
        run: bash scripts/ci/test-appliance-update.sh

      # The bridge endpoint is shared by systemd, Avahi, the updater, and the
      # standalone Foxglove owner. Keep the persisted-port behavior and probe
      # independent of a ROS/systemd host so this catches regressions in CI.
      - name: bridge endpoint config and probe
        run: bash scripts/ci/test-bridge-config.sh

      - name: local archive service contract
        run: bash scripts/ci/test-archive-service.sh

      # Repeat appliance converges must not depend on raw GitHub availability.
      - name: recorder RealSense udev rule install
        run: bash scripts/ci/test-recorder-udev-rules.sh

      # The manifests decide what lands under src/, and a kebab checkout path
      # there is a workspace colcon refuses to build. This holds the tracked
      # manifests to the snake spelling and proves the guard that reads the
      # untracked overlay still refuses the other one.
      - name: manifest checkout paths
        run: bash scripts/ci/test-manifest-paths.sh

      # Sim is the default and --real is the flag — the claim the onboarding demo
      # and the loop job both rest on. The argument layer needs no ROS and no
      # Docker, so a broken flag surfaces here in a second rather than twenty
      # minutes into the loop job's build.
      - name: lifecycle verb resolution
        run: bash scripts/ci/test-lifecycle-verbs.sh

      # `fm stack up` decides whether a stack is running from a publisher count,
      # never from the topic name: a LAN subscriber makes the name appear on a
      # container that is running nothing (#136). Stubbed `ros2` output, so this
      # runs here rather than needing a rig with the Jetson on the same LAN.
      - name: stack publisher detection
        run: bash scripts/ci/test-stack-publisher.sh

      # Each role owns a compose project, so the sim stack and the processor
      # never share one container (#135). The libraries only build the
      # invocation, so no Docker is needed to hold them to it.
      - name: compose project per role
        run: bash scripts/ci/test-compose-project.sh

      # A repo with a metapackage at its root hides the packages nested inside it,
      # and a build that misses them fails an hour later inside the loop (#147).
      - name: the build verb sees the whole workspace
        run: bash scripts/ci/test-build-verb.sh

      # Whether the container joins the host's loopback DDS island depends on the
      # overlay and the profile, and when it is wrong nothing errors — the bridge
      # simply routes an empty graph (#148). Asserted, not read.
      - name: container joins the host's DDS island
        run: bash scripts/ci/test-compose-transport.sh

      # The processor role picks native Humble or the Humble container by host
      # (#127); the picker is stubbed here so a wrong branch fails in CI, not on
      # the workstation.
      - name: processor runtime resolution
        run: bash scripts/ci/test-processor-runtime.sh

      # The dataset verbs must reach the runtime that HAS the engine. Routing them
      # on --backend sent them into the sim container, which is built without it
      # (#145).
      - name: dataset verbs run where the engine is
        run: bash scripts/ci/test-dataset-runtime.sh

      # A non-Humble Linux processor uses its prepared Humble container for the
      # standalone Foxglove bridge. Exercise the existing-only route and scoped
      # stop helper with stubs; never launch systemd, Docker, or ROS in CI.
      - name: standalone Foxglove service routes
        run: bash scripts/ci/test-foxglove-service.sh

      # The optional Ohio route is a real installer transaction: first/repeat
      # convergence and malformed/conflicting values must fail before any unit,
      # env, or systemd mutation.
      - name: processor service config transaction
        run: bash scripts/ci/test-processor-service-config.sh

      # Container entry resolves the nested data package source on the host because
      # Git ownership checks can reject that checkout as container root. Verify
      # valid/mismatched/sentinel, tracked-dirty, and offline paths without Docker.
      - name: processor container source identity
        run: bash scripts/ci/test-processor-container-exec.sh

      # `ros2 launch` exits 0 even when every node it started has died, which let
      # fm-processor.service report success while the processor was gone (#134).
      # The wrapper's exit policy is graded here against a stubbed `ros2`.
      - name: processor service exit policy
        run: bash scripts/ci/test-processor-service-exit.sh

      # The processor Roles Anywhere installer is tested entirely offline: fake
      # pinned AWS binaries and a temporary OpenSSL CA cover first/repeat/partial
      # states, certificate validation, check/receipt/uninstall, and the
      # read-only container boundary without touching a real tower or AWS account.
      - name: processor AWS identity installer
        run: bash scripts/ci/test-processor-identity.sh

      # Every install script is Linux-only and mostly unreachable in CI, so a parse
      # error would otherwise surface first on a real rig mid-provision.
      - name: install scripts parse
        run: |
          set -euo pipefail
          for s in scripts/install/*.sh scripts/run/*.sh; do
            bash -n "$s" || { echo "FAIL: $s has a syntax error"; exit 1; }
          done
          echo "install/run script syntax OK"

  workspace:
    name: build + test + smoke (humble)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # fm-ros2 holds no package source — the seven package repos are private, so
      # mint a short-lived GitHub App token (fm-ros2-ci, Contents:read) and pull
      # them into src/ before building.
      - uses: ./.github/actions/import-packages
        id: packages
        with:
          app-id: ${{ secrets.FM_CI_APP_ID }}
          private-key: ${{ secrets.FM_CI_APP_KEY }}

      # The public workspace manifest does not name the private data source.
      # Check it out separately with the same short-lived read-only App token.
      - uses: actions/checkout@v7
        with:
          repository: ${{ format('first-motive/{0}-{1}', 'fm', 'data') }}
          token: ${{ steps.packages.outputs.token }}
          path: src/fm_data

      # fm-ros2 owns no image — pull the published fm-app full-stack image (the top
      # of the inheritance chain: fm-docker base -> fm-robot -> fm-app), which
      # carries the exact deps the assembled workspace needs (moveit, ros2_control,
      # the sim backends, rosidl_generator_dds_idl for the vendored Unitree
      # messages). Tag it fm-ros2:ci so the build/test steps below are unchanged.
      # The fm-app GHCR package is private, so log in with the App token (the
      # fm-ros2-ci app needs packages:read on the first-motive org).
      - name: Pull launcher image
        run: |
          echo "${{ steps.packages.outputs.token }}" | \
            docker login ghcr.io -u x-access-token --password-stdin
          docker pull ghcr.io/first-motive/fm-app:humble
          docker tag ghcr.io/first-motive/fm-app:humble fm-ros2:ci

      # external is gitignored, so CI must vendor the sources the build consumes
      # (openarm_description, the unitree_hg messages, ...) at their pinned commits.
      - name: Import externals
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc './scripts/install/import-externals.sh'

      # The archive and processor must use one receipt-bound LeRobot import
      # root. This check is source-only and runs after the private data source
      # checkout is imported, before the assembled build starts.
      - name: LeRobot archive-to-Process root contract
        run: bash scripts/ci/test-processor-lerobot-root.sh

      - name: colcon build
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc 'source /opt/ros/humble/setup.bash && colcon build --symlink-install'

      # Test the First Motive packages only — the vendored externals (openarm_*,
      # unitree_*) carry their own test suites, which are not ours to keep green.
      # colcon test alone exits 0 even on failures; run it, then let colcon test-result
      # surface the failing output and set the non-zero exit.
      - name: colcon test
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc 'source /opt/ros/humble/setup.bash && source install/setup.bash &&
                      fm_pkgs=$(colcon list --names-only | grep "^fm_") &&
                      colcon test --packages-select $fm_pkgs &&
                      colcon test-result --verbose'

      # Compare what the packages declare against what the image installs. The images
      # never run rosdep, so the two lists drift silently — that is how the container
      # rviz path lost joint_state_publisher_gui and stayed broken (fm-robot#35).
      #
      # Blocking. The findings it opened with were triaged (fm-robot#36): two belonged
      # to the private learning overlay, whose packages this image is not built to run
      # and which the check no longer scopes in; two were the arm64-only Gazebo
      # absence, which does not apply on the amd64 runner; and three were real gaps,
      # fixed in fm-robot#37 and fm-app#48. Nothing is exempted, so a new drift is a
      # red job on the commit that introduces it.
      - name: Declared dependencies exist in the image
        run: ./scripts/ci/check-image-deps.sh fm-ros2:ci

      # The integration gate. Every assert in ci-smoke.sh is a state assert — a
      # controller reaching `active`, a commanded joint landing on its motor index,
      # odometry tracking a published Twist — so this job goes red for a stack that
      # comes up and does nothing, which build + test above cannot catch.
      #
      # The script's own teardown is bounded (timed waits then SIGKILL, never a bare
      # `wait`), which is what previously risked hanging the job; the step timeout
      # below is the second bound.
      - name: Headless teleop smoke (state asserts)
        timeout-minutes: 20
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc './scripts/ci/ci-smoke.sh'

  # The sim-first loop: stack up (sim) -> episode record -> dataset process ->
  # assert the artifacts. Every other job grades a part of the system; this one
  # grades the path the company actually runs on, on a box with no hardware and
  # no robot attached.
  #
  # It repeats the workspace job's setup rather than extending it because the two
  # answer different questions — "does it build and behave" versus "does the data
  # path close" — and a red build should not hide a broken loop or vice versa.
  #
  # NOT YET REQUIRED. Promote it to a required check after two consecutive greens
  # on main (plan step 15.3); the first runs are what tell us whether the mujoco
  # backend and the recorder are stable enough on a hosted runner to gate merges.
  loop:
    name: sim-first loop (record -> process)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/import-packages
        id: packages
        with:
          app-id: ${{ secrets.FM_CI_APP_ID }}
          private-key: ${{ secrets.FM_CI_APP_KEY }}

      - name: Pull launcher image
        run: |
          echo "${{ steps.packages.outputs.token }}" | \
            docker login ghcr.io -u x-access-token --password-stdin
          docker pull ghcr.io/first-motive/fm-app:humble
          docker tag ghcr.io/first-motive/fm-app:humble fm-ros2:ci

      # The loop is the one job that needs the data engine, which lives in the
      # private learning overlay. Its repo slugs come from a repo variable so no
      # tracked file names them (repo-hygiene refuses that).
      - name: Import the learning overlay
        env:
          FM_OVERLAY_REPOS: ${{ vars.FM_OVERLAY_REPOS }}
        run: ./scripts/ci/import-overlay.sh

      - name: Import externals
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc './scripts/install/import-externals.sh'

      # The launcher image carries no overlay dependencies, so they are installed
      # here and the container is committed back as the image the loop step runs
      # — a `--rm` step would drop them before the next one started. The overlay
      # repos carry a metapackage at their root, so colcon and rosdep stop there
      # and never see the nested packages: rosdep is given the nested dirs
      # explicitly, and the build goes through `fm build`, which discovers them —
      # the same verb a person types, so CI cannot pass on a workspace shape the
      # verb would miss. -r keeps a stray unresolvable key from
      # masking the loop's own verdict. The engine's bag-ingest tier is pip, not
      # rosdep — numpy pinned to the last 3.10-compatible release because the
      # Humble image's Python is 3.10, exactly as setup-processor.sh does.
      - name: Install overlay dependencies and build
        run: |
          docker run --name ws-build -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc 'source /opt/ros/humble/setup.bash \
              && (rosdep update --rosdistro humble >/dev/null 2>&1 || true) \
              && apt-get update -qq \
              && rosdep install --from-paths src external src/fm_data/fm_data_* src/fm_policy/fm_policy_* \
                   --ignore-src -y -r --rosdistro humble \
              && pip install --quiet "numpy==2.2.6" \
                   "$(grep -E "^rosbags==" src/fm_data/fm_data_dataset/requirements-bags.txt)" \
              && ./scripts/run/build.sh'
          docker commit ws-build fm-ros2:ci >/dev/null
          docker rm ws-build >/dev/null

      # The loop drives the same verbs a person types. Bounded by the script's own
      # timed waits and teardown, with the step timeout as the second bound.
      #
      # Still pinned to `none`, and now for a narrower reason than before.
      #
      # The pin was raised when the loop failed here and the workspace was also
      # incomplete, which made the transport a suspect it did not deserve. The
      # workspace is whole now — the image's missing apt packages are installed,
      # the mujoco backend builds, and `fm build` reaches the nested data packages
      # (#147) — so the two questions are separable, and dropping the pin was tried
      # on that basis.
      #
      # It still fails, and the run narrows the fault rather than explaining it:
      #
      #   PASS: stack up on the mujoco backend
      #   PASS: topic surface complete        (/joint_states advertised and listed)
      #   FAIL: no /joint_states message within 20s
      #
      # So under the zenoh profile in this container the graph forms and a
      # subscriber still receives no sample. That is not the shape of a missing
      # package, and it is not what the same stack does on real hardware: gate 3.1
      # reads 100 Hz in the workstation's container under this profile. Whatever
      # differs is specific to a bare `docker run` — no host networking, no
      # `--ipc host`, and the 64 MB default /dev/shm rather than the 128 MB the
      # compose overlay sets for exactly this middleware.
      #
      # `none` leaves the image's own middleware alone, which is what this job had
      # before the verbs sourced a transport at all. Drop the pin when the
      # difference above is understood — not merely when hardware is green, which
      # it now is.
      - name: Record and process an episode
        timeout-minutes: 25
        run: |
          docker run --rm -e FM_TRANSPORT=none \
            -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc './scripts/ci/loop.sh'

  # The real native path, end to end: full pixi env from the lockfile, host colcon
  # build, the runtime smoke (launcher import + every registry launch target
  # resolved via `ros2 launch --print`), and the host-native sim core. The build
  # alone cannot catch a missing runtime dep — colcon ignores install_requires and
  # launch-time packages — so this is the job that fails when the env lacks
  # textual, joint_state_publisher, or their kin. The env is cached on pixi.lock,
  # so warm runs skip the solve.
  native:
    name: native env + launch smoke (macos arm64)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # The package repos are private — same short-lived App token as workspace.
      - uses: ./.github/actions/import-packages
        with:
          app-id: ${{ secrets.FM_CI_APP_ID }}
          private-key: ${{ secrets.FM_CI_APP_KEY }}

      - uses: astral-sh/setup-uv@v7

      # import-externals.sh shells out to vcs; provision vcstool the same way
      # install.sh does (setuptools<81 keeps pkg_resources importable).
      - name: Vendor externals
        run: |
          uv tool install --quiet vcstool --with "setuptools<81"
          uv_bin="$(uv tool dir --bin)"
          export PATH="$uv_bin:$PATH"
          ./scripts/install/import-externals.sh

      # Full env install from pixi.lock (not run-install: false) — the point of
      # this job is the real runtime env. Cached on the lockfile hash.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Build workspace (native)
        run: pixi run build

      - name: Launch smoke
        run: ./scripts/ci/native-launch.sh

      # The ROS-free half of the macOS story, which used to be its own job on a
      # second macOS runner with its own checkout, token, and pixi install: the
      # sim-core pytest suite, a real native arm64 mujoco step, the install/run
      # dispatch asserts, and the pixi lock check across all three platforms. It
      # needs the same inputs this job already has, so it runs here.
      - name: Host-native sim core smoke
        run: ./scripts/ci/ci-smoke-macos.sh

  # Windows is a native-only, no-Docker path that no one runs yet — it was built
  # ahead of a user. That is the reason to keep testing it: an untested future path
  # rots silently, and the first person to need it pays for every commit since.
  # The job is cheap (no env solve, no ROS) and it is the only thing anywhere that
  # exercises the .ps1 wrappers.
  windows:
    name: native dispatch (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Install the pixi binary only (no full env solve — run-install: false) so the
      # shared dispatch smoke can run the lock check on the Windows runner.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false

      # Windows delegates to bash via Git for Windows (bundled on windows-latest).
      # The shared dispatch smoke exercises install flag parsing, the OS-default
      # profile (native on Windows), run.sh routing, and the pixi lock check — the
      # same script the native job runs through ci-smoke-macos.sh. No Docker, no
      # ROS2 (Windows is native-only).
      - name: Native dispatch smoke (Git Bash)
        shell: bash
        run: ./scripts/ci/native-dispatch.sh

      # The .ps1 wrappers must parse, locate Git Bash, and delegate. FM_SELFTEST
      # makes install.sh / run.sh stop after resolving, so this proves the wrapper
      # hand-off without a real env solve or launch.
      - name: PowerShell wrappers delegate to bash
        shell: pwsh
        env:
          FM_SELFTEST: '1'
        run: |
          .\install.ps1 --native --viewer foxglove
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 did not delegate cleanly' }
          .\run.ps1 --native
          if ($LASTEXITCODE -ne 0) { throw 'run.ps1 did not delegate cleanly' }

  installer:
    name: installer import path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # install.sh installs vcstool via uv on a bare host, then drives the imports.
      - uses: astral-sh/setup-uv@v7

      # The package repos install.sh imports are private — mint the same short-lived
      # App token the workspace job uses. No clone here: the point of this job is
      # that install.sh does the importing.
      - uses: ./.github/actions/import-packages
        id: packages
        with:
          app-id: ${{ secrets.FM_CI_APP_ID }}
          private-key: ${{ secrets.FM_CI_APP_KEY }}
          clone: "false"

      # Run the installer: setup only (clone + import + viewer), no docker build or
      # run — that is run.sh's job. install-foxglove self-skips off macOS, so this
      # runs clean on Linux. Rewrite github.com to carry the App token so the vcs
      # import over HTTPS authenticates, then assert src/ came out populated.
      - name: Run installer
        # Clone the branch under test (not the merged main) so the installer runs
        # this ref's scripts against this ref's layout. head_ref is set on PR events,
        # ref_name on push events — one of them names the branch either way.
        env:
          FM_REPO_REF: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ steps.packages.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          # Provision from an empty dir — the real curl|bash path. Running from the
          # repo root collides the fm_ros2 clone target with the fm_ros2/ workspace
          # metapackage already checked out there.
          workdir="$(mktemp -d)"
          cd "$workdir"
          bash "$GITHUB_WORKSPACE/install.sh"
          for pkg in fm_robot fm_sim fm_teleop fm_app; do
            test -d "fm_ros2/src/$pkg" || { echo "missing src/$pkg"; exit 1; }
          done
          echo "src/ populated — installer import path green"

  panel:
    name: foxglove teleop panel build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The teleop panel lives in the fm-teleop repo — check it out to build it.
      - uses: ./.github/actions/import-packages
        id: packages
        with:
          app-id: ${{ secrets.FM_CI_APP_ID }}
          private-key: ${{ secrets.FM_CI_APP_KEY }}
          clone: "false"

      - uses: actions/checkout@v7
        with:
          repository: first-motive/fm-teleop
          token: ${{ steps.packages.outputs.token }}
          path: src/fm_teleop

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Type-checks + bundles the TypeScript/React teleop panel (not part of the ROS
      # workspace). Catches panel breakage — a broken ROBOTS entry, a type error.
      - name: Build panel
        working-directory: src/fm_teleop/fm_teleop_panel
        run: |
          npm ci
          npm run build
