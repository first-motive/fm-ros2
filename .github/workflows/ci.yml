name: CI

# Skip CI when only docs / non-code change — the orchestrator build is expensive
# (base image + full assembled colcon build).
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]
  pull_request:
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]

# Read-only by default. The two jobs that touch a registry mint their own
# short-lived App token, so no job needs a broader GITHUB_TOKEN than this.
permissions:
  contents: read

# One run per ref. A push onto a branch that is already building supersedes the
# older run; main is never cancelled, so every merged commit keeps a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Rendered files (AGENTS.md, .fm/) come from the render plane and carry a hash of
  # their own body. This fails the PR when one was edited in place.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  # The piped-curl front door check, the in-tree updater and uninstall smokes, and
  # the install-script parse pass all live in first-motive/.github.
  selftest:
    uses: first-motive/.github/.github/workflows/bootstrap-selftest.yml@main
    with:
      scripts: install.sh run.sh
      in-tree-scripts: '"scripts/update.sh" "install.sh uninstall --purge"'
      parse-globs: scripts/install/*.sh scripts/run/*.sh

  # Appliance-specific guards that no other repo runs: the updater's busy gate, the
  # bridge endpoint config, and the recorder's udev rule install.
  appliance:
    name: appliance guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The appliance updater must tell "a take is in flight" from "idle". The
      # tactile bridge appends to recordings/tactile-raw continuously, even while
      # the recorder is idle, so the updater prunes that one directory — without
      # the prune a glove-equipped rig can never converge on an update.
      - name: appliance updater busy gate (recorder)
        run: bash scripts/ci/test-appliance-update.sh

      # The bridge endpoint is shared by systemd, Avahi, the updater, and the
      # standalone Foxglove owner. Keep the persisted-port behavior and probe
      # independent of a ROS/systemd host so this catches regressions in CI.
      - name: bridge endpoint config and probe
        run: bash scripts/ci/test-bridge-config.sh

      # Repeat appliance converges must not depend on raw GitHub availability.
      - name: recorder RealSense udev rule install
        run: bash scripts/ci/test-recorder-udev-rules.sh

  workspace:
    name: build + test + smoke (humble)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # fm-ros2 holds no package source — the seven package repos are private, so
      # mint a short-lived GitHub App token (fm-ros2-ci, Contents:read) and pull
      # them into src/ before building.
      - uses: ./.github/actions/import-packages
        id: packages
        with:
          app-id: ${{ secrets.FM_CI_APP_ID }}
          private-key: ${{ secrets.FM_CI_APP_KEY }}

      # fm-ros2 owns no image — pull the published fm-app full-stack image (the top
      # of the inheritance chain: fm-docker base -> fm-robot -> fm-app), which
      # carries the exact deps the assembled workspace needs (moveit, ros2_control,
      # the sim backends, rosidl_generator_dds_idl for the vendored Unitree
      # messages). Tag it fm-ros2:ci so the build/test steps below are unchanged.
      # The fm-app GHCR package is private, so log in with the App token (the
      # fm-ros2-ci app needs packages:read on the first-motive org).
      - name: Pull launcher image
        run: |
          echo "${{ steps.packages.outputs.token }}" | \
            docker login ghcr.io -u x-access-token --password-stdin
          docker pull ghcr.io/first-motive/fm-app:humble
          docker tag ghcr.io/first-motive/fm-app:humble fm-ros2:ci

      # external is gitignored, so CI must vendor the sources the build consumes
      # (openarm_description, the unitree_hg messages, ...) at their pinned commits.
      - name: Import externals
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc './scripts/install/import-externals.sh'

      - name: colcon build
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc 'source /opt/ros/humble/setup.bash && colcon build --symlink-install'

      # Test the First Motive packages only — the vendored externals (openarm_*,
      # unitree_*) carry their own test suites, which are not ours to keep green.
      # colcon test alone exits 0 even on failures; run it, then let colcon test-result
      # surface the failing output and set the non-zero exit.
      - name: colcon test
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc 'source /opt/ros/humble/setup.bash && source install/setup.bash &&
                      fm_pkgs=$(colcon list --names-only | grep "^fm_") &&
                      colcon test --packages-select $fm_pkgs &&
                      colcon test-result --verbose'

      # The integration gate. Every assert in ci-smoke.sh is a state assert — a
      # controller reaching `active`, a commanded joint landing on its motor index,
      # odometry tracking a published Twist — so this job goes red for a stack that
      # comes up and does nothing, which build + test above cannot catch.
      #
      # The script's own teardown is bounded (timed waits then SIGKILL, never a bare
      # `wait`), which is what previously risked hanging the job; the step timeout
      # below is the second bound.
      - name: Headless teleop smoke (state asserts)
        timeout-minutes: 20
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" -w /ws fm-ros2:ci \
            bash -lc './scripts/ci/ci-smoke.sh'

  # The real native path, end to end: full pixi env from the lockfile, host colcon
  # build, the runtime smoke (launcher import + every registry launch target
  # resolved via `ros2 launch --print`), and the host-native sim core. The build
  # alone cannot catch a missing runtime dep — colcon ignores install_requires and
  # launch-time packages — so this is the job that fails when the env lacks
  # textual, joint_state_publisher, or their kin. The env is cached on pixi.lock,
  # so warm runs skip the solve.
  native:
    name: native env + launch smoke (macos arm64)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # The package repos are private — same short-lived App token as workspace.
      - uses: ./.github/actions/import-packages
        with:
          app-id: ${{ secrets.FM_CI_APP_ID }}
          private-key: ${{ secrets.FM_CI_APP_KEY }}

      - uses: astral-sh/setup-uv@v7

      # import-externals.sh shells out to vcs; provision vcstool the same way
      # install.sh does (setuptools<81 keeps pkg_resources importable).
      - name: Vendor externals
        run: |
          uv tool install --quiet vcstool --with "setuptools<81"
          export PATH="$(uv tool dir --bin):$PATH"
          ./scripts/install/import-externals.sh

      # Full env install from pixi.lock (not run-install: false) — the point of
      # this job is the real runtime env. Cached on the lockfile hash.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Build workspace (native)
        run: pixi run build

      - name: Launch smoke
        run: ./scripts/ci/native-launch.sh

      # The ROS-free half of the macOS story, which used to be its own job on a
      # second macOS runner with its own checkout, token, and pixi install: the
      # sim-core pytest suite, a real native arm64 mujoco step, the install/run
      # dispatch asserts, and the pixi lock check across all three platforms. It
      # needs the same inputs this job already has, so it runs here.
      - name: Host-native sim core smoke
        run: ./scripts/ci/ci-smoke-macos.sh

  installer:
    name: installer import path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # install.sh installs vcstool via uv on a bare host, then drives the imports.
      - uses: astral-sh/setup-uv@v7

      # The package repos install.sh imports are private — mint the same short-lived
      # App token the workspace job uses. No clone here: the point of this job is
      # that install.sh does the importing.
      - uses: ./.github/actions/import-packages
        id: packages
        with:
          app-id: ${{ secrets.FM_CI_APP_ID }}
          private-key: ${{ secrets.FM_CI_APP_KEY }}
          clone: "false"

      # Run the installer: setup only (clone + import + viewer), no docker build or
      # run — that is run.sh's job. install-foxglove self-skips off macOS, so this
      # runs clean on Linux. Rewrite github.com to carry the App token so the vcs
      # import over HTTPS authenticates, then assert src/ came out populated.
      - name: Run installer
        # Clone the branch under test (not the merged main) so the installer runs
        # this ref's scripts against this ref's layout. head_ref is set on PR events,
        # ref_name on push events — one of them names the branch either way.
        env:
          FM_REPO_REF: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ steps.packages.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          # Provision from an empty dir — the real curl|bash path. Running from the
          # repo root collides the fm_ros2 clone target with the fm_ros2/ workspace
          # metapackage already checked out there.
          workdir="$(mktemp -d)"
          cd "$workdir"
          bash "$GITHUB_WORKSPACE/install.sh"
          for pkg in fm_robot fm_sim fm_teleop fm_app; do
            test -d "fm_ros2/src/$pkg" || { echo "missing src/$pkg"; exit 1; }
          done
          echo "src/ populated — installer import path green"

  panel:
    name: foxglove teleop panel build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The teleop panel lives in the fm-teleop repo — check it out to build it.
      - uses: ./.github/actions/import-packages
        id: packages
        with:
          app-id: ${{ secrets.FM_CI_APP_ID }}
          private-key: ${{ secrets.FM_CI_APP_KEY }}
          clone: "false"

      - uses: actions/checkout@v7
        with:
          repository: first-motive/fm-teleop
          token: ${{ steps.packages.outputs.token }}
          path: src/fm_teleop

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Type-checks + bundles the TypeScript/React teleop panel (not part of the ROS
      # workspace). Catches panel breakage — a broken ROBOTS entry, a type error.
      - name: Build panel
        working-directory: src/fm_teleop/fm_teleop_panel
        run: |
          npm ci
          npm run build
