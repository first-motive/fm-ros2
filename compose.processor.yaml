# Processor overlay — stacked on compose.yaml + compose.linux.yaml when the
# processor role runs in the Humble container (scripts/internal/lib-processor.sh).
#
# The role's data directories are mounted at their host paths and HOME points at
# the host home, so every ~/...-shaped knob in /etc/fm-processor.env names the
# same files inside and outside the container. Only these directories cross:
# the whole home would carry ~/.ssh and ~/.git-credentials into a root
# container, and nothing in the role reads them (the engine is cloned on the
# host). A knob pointed outside this set needs its directory added here.
# setup-processor.sh creates them first, so they mount user-owned.
services:
  fm:
    environment:
      - HOME=${HOME}
    volumes:
      - ${FM_PROCESSOR_DATA_ROOT:-${HOME}}/recordings:/data/recordings
      - ${FM_PROCESSOR_DATA_ROOT:-${HOME}}/processed:/data/processed
      - ${FM_PROCESSOR_DATA_ROOT:-${HOME}}/annotations:/data/annotations
      - ${FM_PROCESSOR_DATA_ROOT:-${HOME}}/fm-data-runs:/data/fm-data-runs
      # Same directory again at the container's HOME. The role still has
      # ~/...-shaped knobs that no env knob overrides — process_supervisor's
      # model_views_dir default and setup-qwen.sh's FM_QWEN_ROOT — and on a
      # rig with a data volume those name the container's writable layer
      # instead of this mount. The 16 GB weights view then downloads again
      # on every recreate and never satisfies the qwen_ready check.
      - ${FM_PROCESSOR_DATA_ROOT:-${HOME}}/fm-data-runs:${HOME}/fm-data-runs
      - ${FM_PROCESSOR_DATA_ROOT:-${HOME}}/dataset-releases:/data/dataset-releases
      - ${FM_PROCESSOR_DATA_ROOT:-${HOME}}/lerobot-staged:/data/lerobot-staged
      # The relocatable release venv keeps its interpreter in uv's managed
      # Python root. Expose that immutable versioned runtime read-only at the
      # same container path; credentials and the rest of HOME stay outside.
      - ${FM_PROCESSOR_UV_PYTHON_ROOT:-${HOME}/.local/share/uv/python}:/home/fm/.local/share/uv/python:ro
